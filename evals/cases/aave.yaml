id: aave
query: '0x7Fc66500c84A76Ad7e9c93437bFc5Ac33E2DDaE9'
category: healthy
truth_date: '2026-10-11'
summary: >-
  Lending protocol, queried by the AAVE token address. The token contract is an EIP-1967 proxy
  (implementation 0x5d4aa78b08bc7c530e21bf7447988b1be7991322, admin
  0x86c3ffee349a7cff7ca88c449717b1b133bfb517) with upgradeTo and upgradeToAndCall, source an
  exact match on Sourcify, total supply 16,000,000. CoinGecko rank 44, market cap about 2.6
  billion USD, DeFiLlama TVL about 18.6 billion USD on 2026-10-11. The repository
  aave/aave-v3-core is archived (last push 2024-09-03); development continued in other
  repositories of the aave organisation. Dated events: about 1.6 million USD of bad debt after
  a CRV short was liquidated in November 2022 (proposal to cover it on 2022-11-23); DeFiLlama
  lists a 56,000 USD arbitrary external call on 2024-08-28 and an 862,000 USD oracle
  misconfiguration on 2026-03-12, funds returned.
