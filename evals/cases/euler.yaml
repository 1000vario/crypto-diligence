    input: {address: '0xd9Fcd98c322942075A5C3860693e9f4f03AAE07b', chain_id: 1}
  - tool: analyze_bytecode
    input: {address: '0xd9Fcd98c322942075A5C3860693e9f4f03AAE07b'}
  - tool: get_token_metadata
