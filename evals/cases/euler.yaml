id: euler
query: '0xd9Fcd98c322942075A5C3860693e9f4f03AAE07b'
category: exploit
truth_date: '2026-10-11'
summary: >-
  Lending protocol, queried by the EUL token address. The token source is an exact match on
  Sourcify, no proxy, no mint, pause or blacklist selector, total supply about 27.18 million.
  On 2023-03-13 Euler V1 was drained of about 197 million USD through a donation attack
  (donateToReserves and a flash loan); DeFiLlama records 240 million USD returned, which is
  more than the amount it records as stolen: the two figures come from different valuation
  dates and a report must flag the gap rather than smooth it. The protocol relaunched as
  Euler V2; DeFiLlama TVL for the parent is about 303 million USD on 2026-10-11 and its
  hallmarks include a 2025-11-04 Stream Finance event. The repository
  euler-xyz/euler-contracts is archived (last push 2024-05-24). CoinGecko rank 628.
identity:
  name: Euler
  symbol: EUL
  chain: ethereum
  address: '0xd9fcd98c322942075a5c3860693e9f4f03aae07b'
  coingecko_id: euler
  defillama_slug: euler
