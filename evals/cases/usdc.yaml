id: usdc
query: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
category: sensitive
truth_date: '2026-10-11'
summary: >-
  Fiat-backed stablecoin issued by Circle, queried by its Ethereum contract address. The
  contract is an upgradeable proxy (zeppelinos slots, implementation
  0x43506849d7c04f9138d1a2050bbf3a0c054402dd, admin
  0x807a96288a1a408dbc13de2b1d087d10356395d2) with upgradeTo and upgradeToAndCall in the
  proxy; the implementation exposes mint, burn, pause, unpause, blacklist and unBlacklist
  under a master minter, pauser and blacklister. Source verified on Sourcify, 6 decimals,
  supply about 48.5 billion. CoinGecko rank 6, market cap about 73 billion USD, price 0.9996
  USD on 2026-10-11. The reference implementation circlefin/stablecoin-evm is under
  Apache-2.0, last pushed 2026-08-12. No row in the DeFiLlama exploit database. Dated event:
  on 2023-03-11, after Circle disclosed 3.3 billion USD of reserves at Silicon Valley Bank,
  USDC traded below 0.90 USD before returning to its peg once the deposits were guaranteed.
  Holder concentration is readable from Ethplorer and belongs in the report.
identity:
  name: USDC
  symbol: USDC
  chain: ethereum
  address: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
  coingecko_id: usd-coin
  defillama_slug: null
