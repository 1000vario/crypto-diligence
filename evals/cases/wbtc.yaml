  - url: https://api.ethplorer.io/getTopTokenHolders/0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599?apiKey=freekey&limit=10
    title: Ethplorer top holders
    accessed: '2026-10-11'
