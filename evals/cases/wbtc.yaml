    pattern: '(?i)paus'
  - id: owner-or-custodian
    agent: onchain
    pattern: '(?i)(owner|custodian|bitgo|merchant|controller)'
  - id: supply-116k
    agent: onchain
    pattern: '(?i)(116[,. ]?\d\d\d|116 ?k\b|116 thousand|115[,. ]?\d\d\d|117[,. ]?\d\d\d)'
