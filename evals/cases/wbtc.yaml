id: wbtc
query: WBTC
category: sensitive
truth_date: '2026-10-11'
summary: >-
  Bitcoin wrapped on Ethereum, queried by its symbol. The contract at
  0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599 has its source verified on Sourcify, is not a
  proxy, has 8 decimals, a supply of about 116,000 WBTC and exposes mint, burn, pause,
  unpause, transferOwnership and renounceOwnership under an owner contract controlled by the
  custodian; merchants mint and burn through the custodian. CoinGecko lists it as
  wrapped-bitcoin with a price tracking bitcoin. No row in the DeFiLlama exploit database.
  Dated events about custody rather than code: on 2024-08-09 BitGo announced a joint venture
  with BiT Global (revised 2024-08-14) to share control of the custody keys; on 2024-09-19
  Sky (formerly MakerDAO) voted with 88 percent in favour to offboard WBTC as collateral; on
  2024-11-19 Coinbase announced it would suspend WBTC trading from 2024-12-19; BiT Global
  sued Coinbase on 2024-12-13 and a court declined to block the delisting. BitGo stated that
  control had not changed hands while critics said it had: a report must show both claims.
  Holder concentration is readable from Ethplorer and belongs in the report.
identity:
  name: Wrapped Bitcoin
  symbol: WBTC
  chain: ethereum
  address: '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599'
  coingecko_id: wrapped-bitcoin
  defillama_slug: null
checks:
  - tool: get_contract_source
    input: {address: '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599', chain_id: 1}
  - tool: analyze_bytecode
    input: {address: '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599'}
  - tool: get_token_metadata
    input: {address: '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599'}
  - tool: get_token_holders
    input: {address: '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599', limit: 10}
  - tool: coingecko_search
    input: {query: WBTC}
  - tool: coingecko_coin
    input: {id_or_address: wrapped-bitcoin, lookup: id}
  - tool: defillama_hacks
    input: {name_filter: wbtc}
