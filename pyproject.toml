[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-diligence"
version = "0.1.0"
description = "Multi-agent due diligence reports on crypto protocols and tokens. Facts with sources, dates and confidence levels. An information tool, not advice."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Guillaume Couillard" }]
dependencies = [
    "anthropic>=1.13",
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
crypto-diligence = "crypto_diligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crypto_diligence.service" = ["templates/*.html"]
"crypto_diligence" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
